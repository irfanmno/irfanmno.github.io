<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="Lato, Arial, sans-serif">
  <!-- Illustrative cover for the market sentiment project (not real data) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1A2A4C"/><stop offset="1" stop-color="#3D5A80"/></linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#29B6F6" stop-opacity=".35"/><stop offset="1" stop-color="#29B6F6" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="900" height="440" fill="url(#bg)"/>
  <!-- grid -->
  <g stroke="#ffffff" stroke-opacity=".08">
    <line x1="70" y1="60" x2="860" y2="60"/><line x1="70" y1="120" x2="860" y2="120"/><line x1="70" y1="180" x2="860" y2="180"/><line x1="70" y1="240" x2="860" y2="240"/>
    <line x1="70" y1="330" x2="860" y2="330"/>
  </g>
  <text x="24" y="40" fill="#ffffff" fill-opacity=".7" font-size="15" font-weight="700">PRICE</text>
  <text x="24" y="300" fill="#ffffff" fill-opacity=".7" font-size="15" font-weight="700">SENTIMENT</text>

  <!-- price line -->
  <path d="M70 150 L120 140 L170 146 L220 132 L270 128 L300 196 L330 210 L370 188 L420 176 L470 168 L520 158 L560 170 L590 104 L620 96 L670 110 L720 126 L760 210 L790 230 L830 214 L860 206 L860 260 L70 260 Z" fill="url(#area)"/>
  <path d="M70 150 L120 140 L170 146 L220 132 L270 128 L300 196 L330 210 L370 188 L420 176 L470 168 L520 158 L560 170 L590 104 L620 96 L670 110 L720 126 L760 210 L790 230 L830 214 L860 206" fill="none" stroke="#29B6F6" stroke-width="4" stroke-linejoin="round"/>

  <!-- event markers -->
  <g font-size="15" font-weight="700" fill="#ffffff">
    <line x1="285" y1="70" x2="285" y2="390" stroke="#ffffff" stroke-opacity=".5" stroke-dasharray="5 5"/>
    <rect x="215" y="66" width="140" height="28" rx="14" fill="#ffffff" fill-opacity=".15"/><text x="285" y="85" text-anchor="middle">Tariff post</text>
    <line x1="575" y1="70" x2="575" y2="390" stroke="#ffffff" stroke-opacity=".5" stroke-dasharray="5 5"/>
    <rect x="505" y="66" width="140" height="28" rx="14" fill="#ffffff" fill-opacity=".15"/><text x="575" y="85" text-anchor="middle">Policy speech</text>
    <line x1="745" y1="70" x2="745" y2="390" stroke="#ffffff" stroke-opacity=".5" stroke-dasharray="5 5"/>
    <rect x="675" y="66" width="140" height="28" rx="14" fill="#ffffff" fill-opacity=".15"/><text x="745" y="85" text-anchor="middle">CEO scandal</text>
  </g>

  <!-- sentiment bars around a zero line -->
  <line x1="70" y1="330" x2="860" y2="330" stroke="#ffffff" stroke-opacity=".35"/>
  <g>
    <rect x="80" y="318" width="22" height="12" fill="#4ADE80"/>
    <rect x="130" y="312" width="22" height="18" fill="#4ADE80"/>
    <rect x="180" y="322" width="22" height="8" fill="#4ADE80"/>
    <rect x="230" y="316" width="22" height="14" fill="#4ADE80"/>
    <rect x="280" y="330" width="22" height="58" fill="#F87171"/>
    <rect x="330" y="330" width="22" height="40" fill="#F87171"/>
    <rect x="380" y="330" width="22" height="16" fill="#F87171"/>
    <rect x="430" y="324" width="22" height="6" fill="#4ADE80"/>
    <rect x="480" y="318" width="22" height="12" fill="#4ADE80"/>
    <rect x="530" y="330" width="22" height="8" fill="#F87171"/>
    <rect x="580" y="282" width="22" height="48" fill="#4ADE80"/>
    <rect x="630" y="296" width="22" height="34" fill="#4ADE80"/>
    <rect x="680" y="314" width="22" height="16" fill="#4ADE80"/>
    <rect x="730" y="330" width="22" height="22" fill="#F87171"/>
    <rect x="770" y="330" width="22" height="54" fill="#F87171"/>
    <rect x="820" y="330" width="22" height="30" fill="#F87171"/>
  </g>
  <g font-size="13" font-weight="700">
    <text x="860" y="276" text-anchor="end" fill="#4ADE80">positive</text>
    <text x="860" y="406" text-anchor="end" fill="#F87171">negative</text>
  </g>
</svg>
